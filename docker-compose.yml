services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: beacon, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["beacon-data:/var/lib/postgresql/data", "./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
volumes: { beacon-data: {} }
